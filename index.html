<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中國象棋</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">中 國 象 棋</h1>
    </header>

    <!-- Main: Board + Sidebar -->
    <div class="main-content">
      <!-- Board (left) -->
      <div class="board-section">
        <div class="board-frame">
          <canvas id="gameCanvas"></canvas>
        </div>
        <div class="ai-thinking" id="aiThinking" style="display:none">
          <div class="ai-thinking-bar" id="aiThinkingBar"></div>
          <span class="ai-thinking-label">AI 思考中...</span>
        </div>
      </div>

      <!-- Sidebar (right) -->
      <div class="sidebar">
        <!-- Status -->
        <div class="status-row">
          <span class="turn-dot" id="turnDot"></span>
          <span class="turn-label" id="turnLabel">红方走棋</span>
          <span class="status-text" id="statusText">点击棋子开始</span>
        </div>

        <!-- 对局设置：执色 + 难度（同一视觉层级，不堆控件） -->
        <div class="setup-block">
          <div class="diff-group side-group">
            <span class="diff-label">执</span>
            <button type="button" class="side-btn active" data-side="red" id="sideRed">红</button>
            <button type="button" class="side-btn" data-side="black" id="sideBlack">黑</button>
          </div>
          <div class="diff-group">
            <span class="diff-label">难</span>
            <button type="button" class="diff-btn" data-diff="1">初</button>
            <button type="button" class="diff-btn active" data-diff="2">进</button>
            <button type="button" class="diff-btn" data-diff="3">师</button>
          </div>
        </div>

        <!-- 提示：只保留必要分析 -->
        <div class="hint-panel">
          <div class="hint-header">
            <span class="hint-title">提示</span>
            <button type="button" class="hint-refresh" id="hintRefresh" title="重新分析">↻</button>
          </div>
          <div class="hint-body">
            <div class="hint-move" id="hintMove">—</div>
            <div class="hint-eval-bar-wrap">
              <div class="hint-eval-bar">
                <div class="hint-eval-fill" id="hintEvalFill"></div>
                <div class="hint-eval-divider"></div>
              </div>
              <span class="hint-eval-score" id="hintEvalScore">0.00</span>
            </div>
          </div>
        </div>

        <!-- 操作：四字按钮，无 emoji 噪音 -->
        <div class="actions-row">
          <button type="button" class="action-btn" id="btnNewGame">新局</button>
          <button type="button" class="action-btn" id="btnUndo">悔棋</button>
          <button type="button" class="action-btn" id="btnFlip" title="翻转视角">翻转</button>
          <button type="button" class="action-btn" id="btnSound">音效</button>
        </div>

        <div class="captured-row">
          <span class="captured-label">红失</span>
          <span class="captured-items" id="capturedRed"></span>
        </div>
        <div class="captured-row">
          <span class="captured-label">黑失</span>
          <span class="captured-items" id="capturedBlack"></span>
        </div>

        <div class="history-section">
          <div class="history-header">着法</div>
          <div class="history-list" id="moveHistory">
            <span class="history-empty">尚未开始</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
