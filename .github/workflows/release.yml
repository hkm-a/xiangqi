# 打 tag（如 v1.3.1）或手动触发：构建 Windows 桌面端并发布到 GitHub Releases
# 自动更新依赖 latest.json + 签名产物（需仓库 Secrets 中配置私钥）
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本 tag（如 v1.3.1，需与 package.json / tauri 版本一致）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows 桌面构建
    runs-on: windows-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 准备更新签名私钥
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::缺少 Secret TAURI_SIGNING_PRIVATE_KEY。请把本机 .tauri/xiangqi.key 全文粘贴到「Repository secrets」（不要放到 Environment secrets）。"
            exit 1
          fi
          # GitHub Secret 常带末尾换行（ASCII 10），会导致 base64 解码失败
          KEY_TRIMMED="$(printf '%s' "$KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ ${#KEY_TRIMMED} -lt 32 ]; then
            echo "::error::私钥过短（${#KEY_TRIMMED}），请确认粘贴的是 .key 私钥而非 .pub 公钥。"
            exit 1
          fi
          KEY_FILE="${RUNNER_TEMP}/tauri_signing.key"
          # 用 printf 写入，避免再引入换行
          printf '%s' "$KEY_TRIMMED" > "$KEY_FILE"
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
          if [ -n "$KEY_PASSWORD" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          echo "签名私钥已就绪（trim 后长度 ${#KEY_TRIMMED}，使用文件路径注入）"

      - name: 解析版本 tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "手动触发时请填写 tag（如 v1.4.0）" >&2
            exit 1
          fi

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 私钥通过上一步写入 TAURI_SIGNING_PRIVATE_KEY_PATH（已去换行）
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: 中國象棋 ${{ steps.ver.outputs.tag }}
          releaseBody: |
            ## 中國象棋 桌面版 ${{ steps.ver.outputs.tag }}

            - **安装包**：`中國象棋_*_x64-setup.exe`（推荐，含桌面/开始菜单快捷方式）
            - 自动更新清单：`latest.json`（已安装旧版启动后可检测）

            ### 自动更新
            桌面端启动约 3 秒后检查本仓库最新 Release；侧栏出现「新版本」后点 **更新** 即可下载安装并重启。

            ### 校验
            构建由 GitHub Actions 完成；更新产物使用 minisign 签名。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          projectPath: .
          args: --bundles nsis
