[package]
name = "xiangqi"
version = "1.4.0"
description = "中国象棋 · 小而美"
authors = ["xiangqi"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "xiangqi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
